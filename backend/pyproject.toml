[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI backend (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymongo>=4.13",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
  "httpx>=0.27",
  "boto3>=1.35",
  "celery>=5.4",
  "redis>=5.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "langdetect>=1.0.9",
  "numpy>=1.26",
  "anthropic>=1.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs real external services (paid AI APIs, Atlas)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
